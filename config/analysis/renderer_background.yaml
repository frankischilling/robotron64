    type: code
    start: 0x7D8B0
    vram: 0x8007CCB0
    subsegments:
      - [0x7D8B0, data, background_color_mode]
  - [0x7D8B4, bin, after_mode]
  - name: background_dispatch_table
    type: code
    start: 0x95880
    vram: 0x80094C80
    subsegments:
      - [0x95880, rodata, background_dispatch_table]
  - [0x958AC, bin, remainder]
